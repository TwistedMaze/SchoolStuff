## Investigar e Pesquisar

### A Internet

---

### Definição

- A internet é uma rede global de computadores de vários tipos, todos ligados entre si a trocarem mensagens, fotos ou vídeos.
- Alguns computadores só servem conteúdos aos outros (servidores)
- Alguns computadores só conseguem ver conteúdos servidos por outros computadores (clientes)

---

### Websites

- Quando navegamos na Internet, interagimos com páginas Web, ou websites.
- Um website é uma página ou conjunto de páginas
- Para acedermos a um website precisamos de um _link_ ou uma _hiperligação_
- Um _link_ é um atalho.

exemplo: [Google](https://www.google.pt)

---

### Pesquisar na Internet

- Navegadores
- Motores de Busca
- Repositórios
- Inteligência Artificial

---

### Navegadores

- Programas que nos permitem aceder a páginas na web
- Programas que nos permitem ver videos, fotografias e ouvir música da web

> “Um navegador web leva você a qualquer lugar na Internet, permitindo ver textos, imagens e vídeos de qualquer lugar do mundo.”  
> — *Mozilla Firefox*
---

### Pensa nisto


> “Usamos navegadores web todos os dias, mas entendemos o que eles são e como funcionam?”  
> — *Mozilla Firefox*

Fonte: [Mozilla — O que é um navegador?](https://www.mozilla.org/pt-BR/firefox/browsers/what-is-a-browser/)
---

### Motores de Busca

- Um motor de busca ajuda-nos a **encontrar informação** na Internet.
- Funciona através de **palavras-chave**.
- Mostra uma lista de páginas relacionadas com o que procuramos.

---

### Como funcionam?

- O motor de busca percorre milhões de páginas.
- Guarda cópias dessas páginas num índice.
- Quando pesquisamos, compara as nossas palavras com esse índice.
- Mostra os resultados mais relevantes.

---

### Palavras-chave

- Usar palavras simples e diretas.
- Evitar frases completas.
- Testar sinónimos.

Exemplos:
- "animais perigosos"
- "história de Portugal"
- "como fazer um gráfico"

---

### Operadores úteis

- Aspas → "frase exata"
- Menos → -excluir
- site: → procurar num site específico

Exemplos:
- "energia solar"
- "energia solar" -carros
- site: wikipedia "energia solar"

      function extend() {
        var target = {};
        for (var i = 0; i < arguments.length; i++) {
          var source = arguments[i];
          for (var key in source) {
            if (source.hasOwnProperty(key)) {
              target[key] = source[key];
            }
          }
        }
        return target;
      }

      // default options to init reveal.js
      var defaultOptions = {

        progress: true,
        history: true,
        center: true,

        plugins: [

          RevealZoom,
          RevealNotes,
          RevealMath
        ]
      };

      // options from URL query string
      var queryOptions = Reveal().getQueryHash() || {};

      var options = extend(defaultOptions, {"_":["./2627/slides e atividades"],"static":"docs"}, queryOptions);
    </script>
