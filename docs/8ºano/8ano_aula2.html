## Investigar e Pesquisar

### A Internet II
---

### Repositórios Digitais

- Um repositório é um **local onde conteúdos estão organizados**.
- Pode ter imagens, vídeos, textos, documentos ou arte.

---

### Para que servem?

- Encontrar conteúdos organizados por tema.
- Aceder a materiais com licença aberta.
- Pesquisar imagens ou documentos de forma segura.

---


### Exemplos de Repositórios

- Wikimedia Commons → imagens livres ![wikimedia](./images/commonswiki.png)
- Europeana → arte, cultura e história 
- Biblioteca Nacional Digital → livros e documentos
- Pexels / Unsplash → fotografias livres

<img src="images/europeana.png" style="width=150px; height=40px; margin:20px; background-color: white;  "/>

---

### Como usar um repositório

- Procurar por tema.
- Filtrar resultados.
- Ver informação da imagem/documento.
- Confirmar a licença antes de usar.

---

### Licenças

- Muitos repositórios usam **Creative Commons**.
- Permitem reutilizar imagens ou textos de forma legal.

<img src="./images/CC_logo.jpg" width=150 height=70 style="background-color: white; margin:20 "/>

    <script>
      function extend() {
        var target = {};
        for (var i = 0; i < arguments.length; i++) {
          var source = arguments[i];
          for (var key in source) {
            if (source.hasOwnProperty(key)) {
              target[key] = source[key];
            }
          }
        }
        return target;
      }

      // default options to init reveal.js
      var defaultOptions = {
        controls: true,
        progress: true,
        history: true,
        center: true,
        transition: 'default', // none/fade/slide/convex/concave/zoom
        slideNumber: true,
        highlight: {
          highlightOnLoad: false
        },
        plugins: [
          RevealMarkdown,
          RevealHighlight,
          RevealZoom,
          RevealNotes,
          RevealMath
        ]
      };

      // options from URL query string
      var queryOptions = Reveal().getQueryHash() || {};

      var options = extend(defaultOptions, {"_":["./2627/slides e atividades/"],"static":"docs"}, queryOptions);
    </script>


    <script>
      Reveal.initialize(options);
      Reveal.addEventListener('ready', function (event) {
        const blocks = Reveal.getRevealElement().querySelectorAll('pre code:not(.mermaid)');
        const hlp = Reveal.getPlugin('highlight');
        blocks.forEach(hlp.highlightBlock);
      });
    </script>

    <script>
      const mermaidOptions = extend({ startOnLoad: false }, {});
      mermaid.startOnLoad = false;
      mermaid.initialize(mermaidOptions);
      const cb = function (event) {
        mermaid.init(mermaidOptions, '.stack.present > .present pre code.mermaid');
        mermaid.init(mermaidOptions, '.slides > .present:not(.stack) pre code.mermaid');
      }
      Reveal.addEventListener('ready', cb);
      Reveal.addEventListener('slidetransitionend', cb);
