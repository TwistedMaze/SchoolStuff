## Representação da Informação

**De uma ideia para uma estrutura**

---

### Porque precisamos de organizar a informação?

Antes de criar um website, precisamos de saber:

- Que informação queremos apresentar?
- Que ideias são mais importantes?
- Como estão relacionadas?
- Como vamos organizar o conteúdo?

> **Uma boa organização torna a informação mais fácil de compreender.**

---

### A mesma informação pode ter várias formas

Podemos representar informação através de:

- Texto
- Listas
- Tabelas
- Gráficos
- Esquemas
- **Mapas mentais**

Cada forma pode ser mais adequada para uma determinada situação.

---

### O que é um mapa mental?

Um **mapa mental** organiza ideias a partir de um **tema central**.

As ideias principais formam **ramos**.

Cada ramo pode conter ideias mais específicas.

---

### Exemplo

# TURISMO EM PORTUGAL

- **Destinos**
  - Lisboa
  - Porto
  - Algarve

- **Gastronomia**
  - Pratos
  - Doces
  - Bebidas

- **Cultura**
  - Museus
  - Monumentos
  - Festivais

---

### Um mapa mental não é um texto

❌ **Texto**

> Lisboa é a capital de Portugal e é uma cidade com muitos monumentos, museus e locais de interesse turístico.

✅ **Mapa mental**

**LISBOA**

→ Monumentos  
→ Museus  
→ Gastronomia  
→ Praias

> **Usamos palavras-chave para representar ideias.**

---

### Como construir um mapa mental?

**1. Escolher o tema**

Qual é a ideia principal?

**2. Identificar as ideias principais**

Quais são os grandes assuntos relacionados?

**3. Criar os ramos**

Liga as ideias principais ao tema.

**4. Desenvolver as ideias**

Adiciona exemplos e informação mais específica.

---

### O que torna um mapa mental útil?

Um bom mapa mental:

- Tem um **tema central claro**
- Está **organizado**
- Usa **palavras-chave**
- Mostra relações entre ideias
- Tem informação relevante
- É fácil de compreender

---

## Atividade

# Organiza a informação

Escolhe o tema do **website que vais criar**.

Cria um **mapa mental** para organizar as ideias que poderás apresentar no website.

---

### O teu mapa deve ter...

- **1 tema central**
- Pelo menos **4 ramos principais**
- Pelo menos **2 níveis de informação**
- Palavras-chave
- Exemplos ou detalhes relevantes
- Uma organização lógica

---

### Antes de entregar...

Pergunta a ti próprio:

> **As ideias estão organizadas de forma lógica?**

> **Consigo perceber a estrutura do tema olhando apenas para o mapa?**

> **Consigo explicar por que organizei as ideias desta forma?**

---

## Entrega

### Mapa mental do projeto

O mapa será utilizado mais tarde para:

**Pesquisar → Planear → Criar o website**

> **Primeiro organizamos a informação. Depois decidimos como a apresentar.**

---

## Ferramenta

# WiseMapping

Utiliza o WiseMapping para criar o teu mapa mental.

Não precisas de aprender todas as funcionalidades.

O objetivo é:

> **Organizar e representar informação.**
---

## E depois?

Já temos uma estrutura para o nosso website.
