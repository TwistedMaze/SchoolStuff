## TIC 9º Ano – Dispositivos Móveis

## Dispositivos Móveis
- Sistemas operativos móveis
- Segurança e regras de conduta

- Boas práticas e acessibilidade

---

## Sistemas Operativos Móveis
- Controlam **hardware e sensores** (GPS, câmara, ecrã táctil)
- Otimizam **energia e desempenho**
- Permitem **instalar e gerir aplicações**
- Exemplo: **Android**, **iOS**

💡 Curiosidade:
> O Android é baseado em Linux e tem um kernel adaptado para dispositivos móveis.

---

## 🧭 Evolução do Android
- **2008 – Cupcake:** teclado virtual
- **2011 – Ice Cream Sandwich:** design unificado
- **2014 – Lollipop:** Material Design
- **2020 – Android 11:** permissões temporárias
- **2024 – Android 14:** segurança e acessibilidade melhoradas

<!-- 🎯 Atividade:

## Segurança Móvel
- Atualizações regulares
- Permissões de apps (microfone, localização)
- PIN, biometria e backups
- Evitar apps de fontes desconhecidas

- Uso responsável do telemóvel
- Respeito pela privacidade
- Evitar distrações em contexto escolar
- Pensar antes de publicar

        var target = {};
        for (var i = 0; i < arguments.length; i++) {
          var source = arguments[i];
          for (var key in source) {
            if (source.hasOwnProperty(key)) {
              target[key] = source[key];
            }
          }
        }
        return target;
      }
