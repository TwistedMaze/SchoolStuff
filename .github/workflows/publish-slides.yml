name: Build and publish Slidev decks

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Internet deck
        run: >-
          pnpm exec slidev build
          "2627/slides e atividades/7ºano/7ano_Internet.md"
          --base /SchoolStuff/7ano-internet/
          --out "$GITHUB_WORKSPACE/_site/7ano-internet"

      - name: Build planning deck
        run: >-
          pnpm exec slidev build
          "2627/slides e atividades/7ºano/7ano_PlaneamentoOrganizacao.md"
          --base /SchoolStuff/7ano-planeamento-organizacao/
          --out "$GITHUB_WORKSPACE/_site/7ano-planeamento-organizacao"

      - name: Build operating systems deck
        run: >-
          pnpm exec slidev build
          "2627/slides e atividades/7ºano/7ano_SistemasOperativos.md"
          --base /SchoolStuff/7ano-sistemas-operativos/
          --out "$GITHUB_WORKSPACE/_site/7ano-sistemas-operativos"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
