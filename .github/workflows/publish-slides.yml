name: Build and publish Slidev decks

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Internet deck
        run: >-
          pnpm exec slidev build
          "2627/slides e atividades/7ºano/7ano_Internet.md"
          --base /SchoolStuff/7ano-internet/
          --out "$GITHUB_WORKSPACE/_site/7ano-internet"

      - name: Build planning deck
        run: >-
          pnpm exec slidev build
          "2627/slides e atividades/7ºano/7ano_PlaneamentoOrganizacao.md"
          --base /SchoolStuff/7ano-planeamento-organizacao/
          --out "$GITHUB_WORKSPACE/_site/7ano-planeamento-organizacao"

      - name: Build operating systems deck
        run: >-
          pnpm exec slidev build
          "2627/slides e atividades/7ºano/7ano_SistemasOperativos.md"
          --base /SchoolStuff/7ano-sistemas-operativos/
          --out "$GITHUB_WORKSPACE/_site/7ano-sistemas-operativos"

      - name: Build 8th grade Internet deck
        run: >-
          pnpm exec slidev build
          "2627/slides e atividades/8ºano/8ano_Internet.md"
          --base /SchoolStuff/8ano-aula1/
          --out "$GITHUB_WORKSPACE/_site/8ano-aula1"

      - name: Build 8th grade repositories deck
        run: >-
          pnpm exec slidev build
          "2627/slides e atividades/8ºano/8ano_RepositoriosDigitaisLicencas.md"
          --base /SchoolStuff/8ano-aula2/
          --out "$GITHUB_WORKSPACE/_site/8ano-aula2"

      - name: Build 8th grade accessibility deck
        run: >-
          pnpm exec slidev build
          "2627/slides e atividades/8ºano/8ano_AcessibilidadeWeb.md"
          --base /SchoolStuff/8ano-aula3/
          --out "$GITHUB_WORKSPACE/_site/8ano-aula3"

      - name: Build 8th grade AI deck
        run: >-
          pnpm exec slidev build
          "2627/slides e atividades/8ºano/8ano_InteligenciaArtificial.md"
          --base /SchoolStuff/8ano-aula4/
          --out "$GITHUB_WORKSPACE/_site/8ano-aula4"

      - name: Build 8th grade representation deck
        run: >-
          pnpm exec slidev build
          "2627/slides e atividades/8ºano/8ano_RepresentacaoInformacao.md"
          --base /SchoolStuff/8ano-aula5/
          --out "$GITHUB_WORKSPACE/_site/8ano-aula5"

      - name: Build 8th grade mind maps workshop
        run: >-
          pnpm exec slidev build
          "2627/slides e atividades/8ºano/8ano_MapasMentais.md"
          --base /SchoolStuff/8ano-aula6/
          --out "$GITHUB_WORKSPACE/_site/8ano-aula6"

      - name: Build 9th grade artificial intelligence deck
        run: >-
          pnpm exec slidev build
          "2627/slides e atividades/9ºano/9ano_InteligenciaArtificial.md"
          --base /SchoolStuff/9ano-aula2/
          --out "$GITHUB_WORKSPACE/_site/9ano-aula2"

      - name: Build 9th grade mind maps deck
        run: >-
          pnpm exec slidev build
          "2627/slides e atividades/9ºano/9ano_OrganizacaoInformacao.md"
          --base /SchoolStuff/9ano-aula3-mapas-mentais/
          --out "$GITHUB_WORKSPACE/_site/9ano-aula3-mapas-mentais"

      - name: Build 9th grade mobile devices deck
        run: >-
          pnpm exec slidev build
          "2627/slides e atividades/9ºano/9ano_DispositivosMoveis.md"
          --base /SchoolStuff/9ano-aula5/
          --out "$GITHUB_WORKSPACE/_site/9ano-aula5"

      - name: Redirect the superseded mobile devices URL
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_site/9ano-aula3-dispositivos-moveis"
          cat > "$GITHUB_WORKSPACE/_site/9ano-aula3-dispositivos-moveis/index.html" <<'EOF'
          <!doctype html>
          <html lang="pt">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=/SchoolStuff/9ano-aula5/">
              <link rel="canonical" href="/SchoolStuff/9ano-aula5/">
              <title>Apresentação movida</title>
            </head>
            <body>
              <p>Esta apresentação foi consolidada em <a href="/SchoolStuff/9ano-aula5/">Dispositivos móveis</a>.</p>
            </body>
          </html>
          EOF

      - name: Add all-years index
        run: cp index.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
